name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Needs a classic PAT with `repo` + `read:org` so private and org commits are counted.
      # Runs before snk, whose container creates dist/ as root.
      - name: Generate streak stats and activity graph
        env:
          GH_TOKEN: ${{ secrets.STREAK_TOKEN }}
          ACTIVITY_TITLE: "Yuadhistra's Contribution Activity"
        run: python3 .github/scripts/profile_stats.py ${{ github.repository_owner }} dist

      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
