<rect class="f" x="738.3" y="276.6" width="7" height="9" fill="#3d6fb6" opacity=".9" style="animation-delay:0.90s"/>
<rect class="f" x="748.2" y="281.9" width="7" height="9" fill="#e8e2d4" opacity=".9" style="animation-delay:1.08s"/>
<rect class="f" x="757.9" y="286.2" width="7" height="9" fill="#c4452f" opacity=".9" style="animation-delay:1.26s"/>
<rect class="f" x="767.4" y="289.5" width="7" height="9" fill="#4d8a4f" opacity=".9" style="animation-delay:1.44s"/>
<text x="600" y="358" class="s" font-size="15" font-style="italic" fill="#c0561b">home, somewhere down there</text>
<path d="M640,342 C636,330 632,322 622,312" fill="none" stroke="#c0561b" stroke-width="1.2" stroke-linecap="round"/>
<path d="M622,312 L623,321 M622,312 L630,315" fill="none" stroke="#c0561b" stroke-width="1.2" stroke-linecap="round"/>
</g>
<line x1="56" y1="392" x2="864" y2="392" stroke="#e4ddd0"/>
<text x="56" y="424" class="s" font-size="15" font-style="italic" fill="#c0561b">Right now</text>
<text x="56" y="452" class="s" font-size="15" fill="#8a8174">–</text>
<text x="72" y="452" class="s" font-size="15" fill="#4a443c">Building services for EMIS,</text>
<text x="72" y="472" class="s" font-size="15" fill="#4a443c">Bhutan’s education system</text>
<text x="56" y="502" class="s" font-size="15" fill="#8a8174">–</text>
<text x="72" y="502" class="s" font-size="15" fill="#4a443c">Learning Rust. The borrow</text>
<text x="72" y="522" class="s" font-size="15" fill="#4a443c">checker is winning, for now</text>
<text x="56" y="552" class="s" font-size="15" fill="#8a8174">–</text>
<text x="72" y="552" class="s" font-size="15" fill="#4a443c">Getting CQRS and clean</text>
<text x="72" y="572" class="s" font-size="15" fill="#4a443c">architecture right in practice</text>
<text x="330" y="424" class="s" font-size="15" font-style="italic" fill="#c0561b">Off the keyboard</text>
<text x="330" y="452" class="s" font-size="15" fill="#8a8174">–</text>
<text x="346" y="452" class="s" font-size="15" fill="#4a443c">Trekking, and the higher</text>
<text x="346" y="472" class="s" font-size="15" fill="#4a443c">the better</text>
<text x="330" y="502" class="s" font-size="15" fill="#8a8174">–</text>
<text x="346" y="502" class="s" font-size="15" fill="#4a443c">Football on weekends</text>
<text x="330" y="532" class="s" font-size="15" fill="#8a8174">–</text>
<text x="346" y="532" class="s" font-size="15" fill="#4a443c">Games, more often than</text>
<text x="346" y="552" class="s" font-size="15" fill="#4a443c">I’d like to admit</text>
<text x="604" y="424" class="s" font-size="15" font-style="italic" fill="#c0561b">What I reach for</text>
<text x="604" y="452" class="s" font-size="15" fill="#8a8174">–</text>
<text x="620" y="452" class="s" font-size="15" fill="#4a443c">NestJS, TypeScript, Node.js</text>
<text x="604" y="482" class="s" font-size="15" fill="#8a8174">–</text>
<text x="620" y="482" class="s" font-size="15" fill="#4a443c">PostgreSQL, MySQL, Redis</text>
<text x="604" y="512" class="s" font-size="15" fill="#8a8174">–</text>
<text x="620" y="512" class="s" font-size="15" fill="#4a443c">Docker, NATS, GitHub Actions</text>
<line x1="56" y1="594" x2="864" y2="594" stroke="#e4ddd0"/>
<text x="864" y="626" class="s" font-size="15" font-style="italic" fill="#8a8174" text-anchor="end">code with purpose, build with precision.  <tspan fill="#1f1c18" font-size="18">— Yuadhistra</tspan></text>
</svg>