<svg xmlns="http://www.w3.org/2000/svg" width="920" height="660" viewBox="0 0 920 660" role="img" aria-label="About Yuadhistra Hang Subba, backend developer from Bhutan">
<style>.s{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif} .k{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.f{transform-box:fill-box;transform-origin:top center;animation:f 3.2s ease-in-out infinite alternate}@keyframes f{from{transform:skewX(-4deg)}to{transform:skewX(5deg)}}@media (prefers-reduced-motion:reduce){.f{animation:none}}</style>
<rect width="920" height="660" rx="10" fill="#fbf8f2"/>
<text x="56" y="62" class="k" font-size="11" letter-spacing="2.4" fill="#8a8174">ABOUT ME</text>
<text x="864" y="62" class="s" font-size="13" font-style="italic" fill="#8a8174" text-anchor="end">Bhutan · 27.5° N, 90.4° E</text>
<line x1="56" y1="78" x2="864" y2="78" stroke="#e4ddd0"/>
<text x="56" y="138" class="s" font-size="42" fill="#1f1c18" letter-spacing="-0.5">Hi, I’m Yuadhistra.</text>
<text x="56" y="174" class="s" font-size="22" font-style="italic" fill="#8a8174">Yuadhistra Hang Subba, in full.</text>
<text x="56" y="222" class="s" font-size="17" fill="#4a443c">I’m a backend developer from Bhutan. I like the quiet</text>
<text x="56" y="249" class="s" font-size="17" fill="#4a443c">parts of software: schemas that age well, queues that</text>
<text x="56" y="276" class="s" font-size="17" fill="#4a443c">don’t drop messages, APIs nobody has to think twice</text>
<text x="56" y="303" class="s" font-size="17" fill="#4a443c">about. These days that’s NestJS, PostgreSQL and a fair</text>
<text x="56" y="330" class="s" font-size="17" fill="#4a443c">amount of event-driven plumbing.</text>
<g>
<circle cx="790" cy="140" r="20" fill="none" stroke="#d49a2a" stroke-width="1.5"/>
<path d="M560,300 L612,238 L640,262 L700,170 L736,214 L760,196 L820,262 L864,232 L880,248" fill="none" stroke="#d9d1c3" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M560,320 L600,284 L628,300 L676,226 L700,246 L724,224 L780,292 L812,276 L880,318" fill="none" stroke="#1f1c18" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M668,238 L676,226 L684,236 M716,234 L724,224 L732,234" fill="none" stroke="#1f1c18" stroke-width="1.2"/>
<path d="M676,226 Q735,282 780,292" fill="none" stroke="#8a8174" stroke-width=".8"/>
<rect class="f" x="684.2" y="236.7" width="7" height="9" fill="#3d6fb6" opacity=".9" style="animation-delay:0.00s"/>
<rect class="f" x="695.5" y="246.6" width="7" height="9" fill="#e8e2d4" opacity=".9" style="animation-delay:0.18s"/>
